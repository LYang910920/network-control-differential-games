[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cybercontrol"
version = "0.2.0"
description = "Teaching utilities for network optimal control, differential games, impulse control, and cyber-control examples."
readme = "README.md"
requires-python = ">=3.10"
license-files = ["LICENSE", "COPYRIGHT_AND_LICENSE.md", "THIRD_PARTY_NOTICES.md"]
authors = [{name = "Luxing Yang"}]
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "matplotlib",
    "networkx",
]

[project.optional-dependencies]
graph = ["python-igraph"]
reference = ["python-igraph"]
torch = ["torch"]
dev = ["pytest", "ruff", "python-igraph"]
all = ["python-igraph", "torch", "pytest", "ruff"]

[project.scripts]
cybercontrol = "cybercontrol.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts", "examples/foundations/code", "examples/reference/run_reference_smoke.py"]
exclude = ["examples/reference/reference_repositories"]
target-version = "py310"

[tool.ruff.lint]
extend-ignore = [
    "E402",  # examples set cache/backend paths before importing plotting libraries
    "E741",  # compartment notation uses I for infected state
]
