name: Quality
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install -e ".[dev]"
      - name: Static and unit checks
        run: |
          python -m compileall -q src tests scripts
          ruff check .
          ruff format --check src tests scripts examples/foundations/code
          pytest -q
      - name: Student example
        run: |
          python -m cybercontrol check
          python -m cybercontrol --output-dir artifacts/ci_figures
  teaching-sources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          path: foundation
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          repository: LYang910920/note1-cyber-control-games
          ref: main
          path: note1
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          repository: LYang910920/note2-pinn-pidl-cyber-control
          ref: main
          path: note2
          persist-credentials: false
      - name: Package lecture sources and examples
        run: |
          tar --exclude=.git -czf teaching-sources.tar.gz foundation note1 note2
      - uses: actions/upload-artifact@v4
        with:
          name: teaching-sources
          path: teaching-sources.tar.gz
          retention-days: 3
