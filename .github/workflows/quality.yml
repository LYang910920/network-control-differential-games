name: Quality

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install -e ".[dev]"
      - name: Static and unit checks
        run: |
          python -m compileall -q src tests scripts
          ruff check .
          ruff format --check src tests scripts examples/foundations/code
          pytest -q
      - name: Public smoke and diagrams
        run: |
          python -m cybercontrol smoke
          python scripts/generate_diagrams.py
          python scripts/check_diagram_manifest.py
          find docs/assets/diagrams -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/diagram-hashes-before
          sha256sum docs/assets/diagram_manifest.csv >> /tmp/diagram-hashes-before
          python scripts/generate_diagrams.py
          find docs/assets/diagrams -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/diagram-hashes-after
          sha256sum docs/assets/diagram_manifest.csv >> /tmp/diagram-hashes-after
          diff -u /tmp/diagram-hashes-before /tmp/diagram-hashes-after
