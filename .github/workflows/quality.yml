name: Quality
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install -e ".[dev]"
      - name: Static and unit checks
        run: |
          python -m compileall -q src tests scripts
          ruff check .
          ruff format --check src tests scripts examples/foundations/code
          pytest -q
      - name: Student example
        run: |
          python -m cybercontrol check
          python -m cybercontrol --output-dir artifacts/ci_figures
      - name: Lecture reference consistency
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          text = Path('docs/source/network_control_foundations.tex').read_text()
          body = text.split(r'\begin{thebibliography}')[0]
          references = set(re.findall(r'\\bibitem\{([^}]+)\}', text))
          cited = {key.strip() for group in re.findall(r'\\cite\{([^}]+)\}', body) for key in group.split(',')}
          assert references == cited, (references-cited, cited-references)
          required = {'security2017', 'patch2018', 'repair2019', 'backup2021', 'opinions2020', 'rumor2021', 'impulse2023', 'outsource2024', 'feedback2024', 'war2024', 'awareness2025', 'malware2025'}
          assert required <= cited
          assert Path('docs/network_control_foundations.pdf').is_file()
          print(f'{len(references)} references are connected to the lecture body.')
          PY
