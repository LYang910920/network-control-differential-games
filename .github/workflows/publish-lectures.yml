name: Publish final lecture layout
on:
  push:
    paths: [.github/workflows/publish-lectures.yml]
permissions:
  contents: write
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Adjust contents spacing
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          path = Path('docs/source/network_control_foundations.tex')
          data = path.read_bytes()
          assert hashlib.sha256(data).hexdigest() == '9054472bd22a2cfb043ab3fe791426a5c47cf830432a96f26360d7a985b0dba0'
          old = rb'\begingroup\setlength{\parskip}{0pt}\footnotesize\tableofcontents\endgroup'
          new = rb'\begingroup\setlength{\parskip}{0pt}\footnotesize\linespread{0.90}\selectfont\tableofcontents\endgroup'
          assert data.count(old) == 1
          data = data.replace(old, new)
          assert hashlib.sha256(data).hexdigest() == '0dc7a92203a63de83e9e08110a5726c2462ea5b73a400e5dfdc4d34db7caea7c'
          path.write_bytes(data)
          PY
      - uses: xu-cheng/latex-action@v3
        with:
          working_directory: docs/source
          root_file: network_control_foundations.tex
          args: -pdf -file-line-error -halt-on-error -interaction=nonstopmode
      - name: Publish final source and PDF
        run: |
          if grep -E 'Overfull|undefined references|undefined citations' docs/source/network_control_foundations.log; then exit 1; fi
          cp docs/source/network_control_foundations.pdf docs/network_control_foundations.pdf
          git config user.name 'LYang910920'
          git config user.email '20222003+LYang910920@users.noreply.github.com'
          git add docs/source/network_control_foundations.tex docs/network_control_foundations.pdf
          git commit -m 'Publish the foundation lecture with a compact complete contents page'
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        with:
          name: reviewed-lecture
          path: |
            docs/network_control_foundations.pdf
            docs/source/network_control_foundations.tex
          retention-days: 7
